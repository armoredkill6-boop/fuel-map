<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Мониторинг АЗС РФ</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- MapLibre GL JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* ПОЛНОЕ УДАЛЕНИЕ ВСЕХ ПЛАШЕК, ФЛАГОВ И ССЫЛОК ВНИЗУ */
    .maplibregl-ctrl-attrib,
    .maplibregl-ctrl-logo,
    .leaflet-control-attribution {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Верхняя панель */
    .top-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }
    .top-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
    }
    .top-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .live-badge {
      background: #16a34a;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 700;
    }

    /* Кнопка GPS */
    .gps-btn {
      position: absolute;
      bottom: 25px;
      right: 15px;
      z-index: 10;
      width: 48px;
      height: 48px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
    }
    .gps-btn:active {
      transform: scale(0.92);
    }

    /* Всплывающее окно заправки */
    .maplibregl-popup-content {
      background: #1e293b !important;
      color: #f8fafc !important;
      border-radius: 14px !important;
      padding: 12px !important;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6) !important;
      min-width: 230px;
    }
    .maplibregl-popup-close-button {
      color: #94a3b8 !important;
      font-size: 16px !important;
      padding: 4px 8px !important;
    }
    .st-name {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 3px;
    }
    .st-addr {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .st-row {
      font-size: 12px;
      margin: 4px 0;
      display: flex;
      justify-content: space-between;
    }
    
    .badge-ok { color: #4ade80; font-weight: 700; }
    .badge-warn { color: #facc15; font-weight: 700; }
    .badge-danger { color: #f87171; font-weight: 700; }

    .fuels-line {
      font-size: 11px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 6px;
      border-radius: 6px;
      margin: 6px 0;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* Блок отправки статуса */
    .report-block {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .report-title {
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .act-btn {
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      font-size: 11px;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .act-btn:active {
      background: #0284c7;
    }
  </style>
</head>
<body>

  <div class="top-panel">
    <div>
      <div class="top-title">⛽ Мониторинг АЗС РФ</div>
      <div class="top-sub" id="status-line">Загрузка базы АЗС...</div>
    </div>
    <div class="live-badge">ONLINE</div>
  </div>

  <button class="gps-btn" id="gpsBtn" title="Моя геопозиция">📍</button>
  <div id="map"></div>

  <script>
    // Твой актуальный активный адрес туннеля
    const API_HOST = "https://9030657bc57de3.lhr.life";

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const centerLat = parseFloat(urlParams.get('lat')) || 55.751244;
    const centerLon = parseFloat(urlParams.get('lon')) || 37.618423;
    const zoomLevel = parseInt(urlParams.get('z')) || 12;

    const map = new maplibregl.Map({
      container: 'map',
      attributionControl: false,
      style: {
        version: 8,
        sources: {
          'osm': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256
          }
        },
        layers: [{ id: 'osm-layer', type: 'raster', source: 'osm', minzoom: 0, maxzoom: 19 }]
      },
      center: [centerLon, centerLat],
      zoom: zoomLevel
    });

    const markersMap = new Map();
    let moveTimeout = null;

    // Отправка отчета в базу
    async function sendReport(stationId, fuelStatus, queueLevel) {
      const tgUser = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user)
        ? window.Telegram.WebApp.initDataUnsafe.user.id
        : 0;

      try {
        const res = await fetch(`${API_HOST}/api/report`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            station_id: stationId,
            fuel_status: fuelStatus,
            queue_level: queueLevel,
            user_id: tgUser
          })
        });

        if (res.ok) {
          alert("Спасибо! Отметка сохранена в базу.");
          loadLiveStations();
        } else {
          alert("Ошибка отправки.");
        }
      } catch (err) {
        alert("Ошибка подключения к серверу.");
      }
    }

    // Подгрузка станций из базы fuel_bot.db
    async function loadLiveStations() {
      const c = map.getCenter();
      try {
        const res = await fetch(`${API_HOST}/api/stations?lat=${c.lat}&lon=${c.lng}`);
        const data = await res.json();

        // Очищаем старые маркеры
        markersMap.forEach(m => m.remove());
        markersMap.clear();

        data.forEach(st => {
          let pinColor = '#22c55e';
          let queueText = 'Свободно';
          let badgeClass = 'badge-ok';

          if (st.queue_level === 2) {
            pinColor = '#eab308';
            queueText = 'Очередь (5-8 авто)';
            badgeClass = 'badge-warn';
          } else if (st.queue_level === 3 || st.fuel_status === 'none') {
            pinColor = '#ef4444';
            queueText = st.fuel_status === 'none' ? 'Топлива нет!' : 'Затор (10+ авто)';
            badgeClass = 'badge-danger';
          }

          const el = document.createElement('div');
          el.innerHTML = `<div style="background:${pinColor}; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:bold; border:2px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,0.5); cursor:pointer;">⛽</div>`;

          const fuelsText = (st.fuels && st.fuels.length > 0) ? st.fuels.join(" • ") : "АИ-92 • АИ-95 • ДТ";

          const popupContent = `
            <div class="st-name">${st.name}</div>
            <div class="st-addr">${st.address}</div>
            <div class="fuels-line">${fuelsText}</div>
            <div class="st-row"><span>Очередь:</span> <b class="${badgeClass}">${queueText}</b></div>
            <div class="st-row"><span>Статус:</span> <span>${st.updated_text}</span></div>
            <div class="report-block">
              <div class="report-title">Отметить обстановку:</div>
              <div class="btn-grid">
                <button class="act-btn" onclick="sendReport(${st.id}, 'ok', 1)">🟢 Свободно</button>
                <button class="act-btn" onclick="sendReport(${st.id}, 'ok', 2)">🟡 Очередь</button>
                <button class="act-btn" onclick="sendReport(${st.id}, 'ok', 3)">🔴 Затор</button>
                <button class="act-btn" onclick="sendReport(${st.id}, 'none', 3)">❌ Нет бензина</button>
              </div>
            </div>
          `;

          const popup = new maplibregl.Popup({ offset: 20 }).setHTML(popupContent);
          const marker = new maplibregl.Marker({ element: el })
            .setLngLat([st.lon, st.lat])
            .setPopup(popup)
            .addTo(map);

          markersMap.set(st.id, marker);
        });

        document.getElementById('status-line').innerText = `Загружено ${data.length} реальных АЗС рядом`;
      } catch (e) {
        document.getElementById('status-line').innerText = "Ожидание ответа сервера...";
      }
    }

    map.on('load', loadLiveStations);

    // Автоматическая догрузка станций при перемещении карты
    map.on('moveend', () => {
      clearTimeout(moveTimeout);
      moveTimeout = setTimeout(loadLiveStations, 400);
    });

    // Кнопка GPS
    document.getElementById('gpsBtn').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 13 });
        }, () => {
          alert("Включите GPS на устройстве.");
        }, { enableHighAccuracy: true });
      }
    });
  </script>
</body>
</html>

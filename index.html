<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Мониторинг АЗС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f4f4f7;
      color: #000;
      overflow: hidden;
    }
    #map {
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    /* ПОЛНОСТЬЮ СКРЫВАЕТ LEAFLET И ЛЮБЫЕ НАДПИСИ ВНИЗУ */
    .leaflet-control-attribution {
      display: none !important;
    }
    /* Панель фильтров сверху */
    .filter-bar {
      position: absolute;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }
    .filter-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #eef0f3;
      color: #444;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }
    .filter-btn.active {
      background: #007aff;
      color: #fff;
    }
    /* Кастомная метка АЗС */
    .custom-pin {
      width: 38px;
      height: 38px;
      background: #007aff;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 11px;
    }
    .custom-pin.warning {
      background: #34c759;
    }
    /* Всплывающее окно карточки */
    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      padding: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    .station-popup {
      font-size: 13px;
      min-width: 220px;
      line-height: 1.4;
    }
    .popup-header {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 2px;
      color: #111;
    }
    .popup-sub {
      color: #666;
      font-size: 11px;
      margin-bottom: 8px;
    }
    .fuel-list {
      border-top: 1px solid #eee;
      padding-top: 6px;
    }
    .fuel-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .fuel-name {
      color: #555;
      font-weight: 500;
    }
    .fuel-price {
      font-weight: 700;
      color: #111;
    }
    .fuel-price.high {
      color: #d93025;
    }
  </style>
</head>
<body>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFuelFilter('all')">Все АЗС</button>
    <button class="filter-btn" onclick="setFuelFilter('ai92')">АИ-92</button>
    <button class="filter-btn" onclick="setFuelFilter('ai95')">АИ-95</button>
    <button class="filter-btn" onclick="setFuelFilter('dt')">Дизель</button>
  </div>

  <div id="map"></div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Классическая инициализация БЕЗ блока Leaflet
    const map = L.map('map', {
      attributionControl: false,
      zoomControl: false
    }).setView([55.18688, 34.33363], 13);

    // Классическая светлая подложка OpenStreetMap без API-ключей и водяных знаков
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    let currentFilter = 'all';
    let markers = [];

    // Загрузка живых станций с твоего сервера
    async function fetchStations() {
      try {
        const bounds = map.getBounds();
        const url = `/api/stations?min_lat=${bounds.getSouth()}&max_lat=${bounds.getNorth()}&min_lon=${bounds.getWest()}&max_lon=${bounds.getEast()}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          renderStations(data);
        }
      } catch (e) {
        console.error('Ошибка загрузки станций:', e);
      }
    }

    function renderStations(stations) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      stations.forEach(st => {
        const customIcon = L.divIcon({
          className: 'custom-pin-container',
          html: `<div class="custom-pin">АЗС</div>`,
          iconSize: [38, 38],
          iconAnchor: [19, 19]
        });

        const fuelsText = st.fuels || '';
        const popupContent = `
          <div class="station-popup">
            <div class="popup-header">${st.name || 'АЗС'}</div>
            <div class="popup-sub">${st.brand ? st.brand + ' • ' : ''}${st.address || ''}</div>
            <div class="fuel-list">
              <div class="fuel-row"><span class="fuel-name">Топливо:</span><span class="fuel-price">${fuelsText}</span></div>
            </div>
          </div>
        `;

        const marker = L.marker([st.lat, st.lon], { icon: customIcon })
          .bindPopup(popupContent)
          .addTo(map);

        markers.push(marker);
      });
    }

    function setFuelFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      fetchStations();
    }

    map.on('moveend', fetchStations);
    fetchStations();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Мониторинг АЗС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f4f7;
      overflow: hidden;
    }
    #map {
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    /* ПОЛНОЕ СКРЫТИЕ LEAFLET */
    .leaflet-control-attribution {
      display: none !important;
    }
    .filter-bar {
      position: absolute;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }
    .filter-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #eef0f3;
      color: #333;
      cursor: pointer;
      text-align: center;
    }
    .filter-btn.active {
      background: #007aff;
      color: #fff;
    }
    /* Точки со светофором */
    .pin-status {
      width: 34px;
      height: 34px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 11px;
    }
    .pin-green { background: #28a745; }
    .pin-yellow { background: #ffc107; color: #000; }
    .pin-red { background: #dc3545; }

    .station-popup {
      font-size: 13px;
      min-width: 220px;
      line-height: 1.4;
    }
    .popup-header {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 2px;
      color: #111;
    }
    .popup-sub {
      color: #666;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 6px;
    }
    .badge-green { background: #e8f5e9; color: #2e7d32; }
    .badge-yellow { background: #fffde7; color: #f57f17; }
    .badge-red { background: #ffebee; color: #c62828; }

    .fuel-list {
      border-top: 1px solid #eee;
      padding-top: 6px;
      margin-top: 4px;
    }
    .fuel-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
      font-size: 12px;
    }
    .popup-footer {
      margin-top: 6px;
      font-size: 10px;
      color: #888;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all')">Все АЗС</button>
    <button class="filter-btn" onclick="setFilter('92')">АИ-92</button>
    <button class="filter-btn" onclick="setFilter('95')">АИ-95</button>
    <button class="filter-btn" onclick="setFilter('100')">АИ-100</button>
    <button class="filter-btn" onclick="setFilter('ДТ')">ДТ</button>
  </div>

  <div id="map"></div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Параметры из ссылки
    const urlParams = new URLSearchParams(window.location.search);
    const pLat = parseFloat(urlParams.get('lat'));
    const pLon = parseFloat(urlParams.get('lon'));
    const pZoom = parseInt(urlParams.get('zoom')) || 12;

    // Центр по умолчанию: Москва (если город не передан в ссылке)
    let initialLat = !isNaN(pLat) ? pLat : 55.751244;
    let initialLon = !isNaN(pLon) ? pLon : 37.618423;

    const map = L.map('map', {
      attributionControl: false,
      zoomControl: false
    }).setView([initialLat, initialLon], pZoom);

    // Классическая светлая карта
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // Если координаты в ссылке не указаны — центрируемся по геолокации устройства
    if (isNaN(pLat) && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        map.setView([pos.coords.latitude, pos.coords.longitude], 13);
        loadStations();
      }, () => {});
    }

    let allStations = [];
    let markers = [];
    let currentFilter = 'all';

    async function loadStations() {
      try {
        const b = map.getBounds();
        const query = `min_lat=${b.getSouth()}&max_lat=${b.getNorth()}&min_lon=${b.getWest()}&max_lon=${b.getEast()}`;
        
        let res;
        try {
          res = await fetch(`/api/stations?${query}`);
          if (!res.ok) throw new Error();
        } catch (e) {
          // Прямой защищенный запрос к твоему серверному домену
          res = await fetch(`https://alexkrylov171.fvds.ru/api/stations?${query}`);
        }

        if (res && res.ok) {
          allStations = await res.json();
          renderStations();
        }
      } catch (err) {
        console.error('Ошибка получения станций:', err);
      }
    }

    function renderStations() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      allStations.forEach(st => {
        const fuels = Array.isArray(st.fuels) ? st.fuels : [st.fuels || ''];
        const fuelsStr = fuels.join(' ');

        if (currentFilter !== 'all') {
          if (!fuelsStr.includes(currentFilter)) return;
        }

        const pinClass = st.status === 'red' ? 'pin-red' : (st.status === 'yellow' ? 'pin-yellow' : 'pin-green');
        const icon = L.divIcon({
          className: 'custom-pin-wrap',
          html: `<div class="pin-status ${pinClass}">АЗС</div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        });

        const fuelsHtml = fuels.map(f => `<div class="fuel-item"><span>${f}</span></div>`).join('');
        const badgeClass = st.status === 'red' ? 'badge-red' : (st.status === 'yellow' ? 'badge-yellow' : 'badge-green');

        const popupHtml = `
          <div class="station-popup">
            <div class="popup-header">${st.name || 'АЗС'}</div>
            <div class="popup-sub">${st.brand ? st.brand + ' • ' : ''}${st.address || ''}</div>
            <div class="status-badge ${badgeClass}">${st.status_text || 'Работает'}</div>
            <div style="font-size:11px; margin-bottom:4px; color:#555;">⏳ ${st.queue_text || ''}</div>
            <div class="fuel-list">
              ${fuelsHtml}
            </div>
            <div class="popup-footer">
              <span>Обновлено: ${st.updated_ago || 'недавно'}</span>
            </div>
          </div>
        `;

        const marker = L.marker([st.lat, st.lon], { icon: icon })
          .bindPopup(popupHtml)
          .addTo(map);

        markers.push(marker);
      });
    }

    function setFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderStations();
    }

    map.on('moveend', loadStations);
    loadStations();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мониторинг АЗС РФ</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; }
    #map { width: 100%; height: 100%; z-index: 1; }

    /* Полная изоляция Leaflet-атрибуции */
    .leaflet-control-attribution,
    .leaflet-bottom.leaflet-right,
    .leaflet-bottom,
    div[class*="attribution"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      height: 0px !important;
      width: 0px !important;
      overflow: hidden !important;
    }

    /* Верхняя панель фильтров */
    .top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .status-badge {
      align-self: flex-start;
      background: rgba(20, 20, 22, 0.94);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00E676;
      box-shadow: 0 0 8px #00E676;
    }
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      pointer-events: auto;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn {
      background: rgba(28, 28, 30, 0.92);
      backdrop-filter: blur(8px);
      color: #e0e0e0;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-btn.active {
      background: #0088cc;
      color: #fff;
      border-color: #0088cc;
      font-weight: bold;
    }

    /* Блок слоев */
    .leaflet-top.leaflet-right {
      top: 95px !important;
      right: 12px !important;
    }
    .leaflet-control-layers {
      background: rgba(26, 26, 28, 0.95) !important;
      color: #fff !important;
      border: 1px solid #444 !important;
      border-radius: 10px !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6) !important;
    }
    .leaflet-control-layers-base label {
      font-size: 12px;
      padding: 4px 2px;
      color: #fff;
    }

    /* Карточка АЗС */
    .leaflet-popup-content-wrapper {
      background: #1c1c1e;
      color: #fff;
      border-radius: 14px;
      border: 1px solid #333;
    }
    .leaflet-popup-tip { background: #1c1c1e; }
    .station-popup h3 { font-size: 15px; margin-bottom: 4px; color: #fff; }
    .station-popup .addr { color: #8e8e93; font-size: 11px; margin-bottom: 8px; }
    
    .status-alert {
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .status-alert.available { background: rgba(0, 230, 118, 0.15); color: #00E676; border: 1px solid rgba(0, 230, 118, 0.3); }
    .status-alert.limited { background: rgba(255, 171, 0, 0.18); color: #FFAB00; border: 1px solid rgba(255, 171, 0, 0.3); }
    .status-alert.no_fuel { background: rgba(255, 23, 68, 0.25); color: #FF1744; border: 1px solid rgba(255, 23, 68, 0.4); }

    .station-popup .fuels {
      background: #2c2c2e;
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }
    .updated-time {
      font-size: 10px;
      color: #777;
      margin-top: 6px;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="statusText">Загрузка АЗС...</span>
    </div>
    <!-- Только реальные сети АЗС региона -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setBrand('all', this)">Все АЗС</button>
      <button class="filter-btn" onclick="setBrand('Лукойл', this)">Лукойл</button>
      <button class="filter-btn" onclick="setBrand('Газпромнефть', this)">Газпромнефть</button>
      <button class="filter-btn" onclick="setBrand('Роснефть', this)">Роснефть</button>
      <button class="filter-btn" onclick="setBrand('Нефтьмагистраль', this)">Нефтьмагистраль</button>
      <button class="filter-btn" onclick="setBrand('Татнефть', this)">Татнефть</button>
      <button class="filter-btn" onclick="setBrand('Teboil', this)">Teboil</button>
      <button class="filter-btn" onclick="setBrand('ТРАССА', this)">ТРАССА</button>
    </div>
  </div>

  <div id="map"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const urlParams = new URLSearchParams(window.location.search);
    let startLat = 55.751244, startLon = 37.618423, startZoom = 13;

    if (urlParams.has("center")) {
      const parts = urlParams.get("center").split(",");
      startLat = parseFloat(parts[0]);
      startLon = parseFloat(parts[1]);
    }
    if (urlParams.has("zoom")) {
      startZoom = parseInt(urlParams.get("zoom"));
    }

    const map = L.map('map', {
      center: [startLat, startLon],
      zoom: startZoom,
      attributionControl: false,
      preferCanvas: true
    });

    const baseLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
    const detailedLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });

    baseLayer.addTo(map);

    L.control.layers({
      "🗺️ Стандартная карта": baseLayer,
      "🛣️ Полная дорожная сеть": detailedLayer
    }, null, { position: 'topright', collapsed: true }).addTo(map);

    setInterval(() => {
      document.querySelectorAll('.leaflet-control-attribution, .leaflet-bottom').forEach(el => el.remove());
    }, 300);

    const markersCluster = L.markerClusterGroup({
      chunkedLoading: true,
      maxClusterRadius: 35,
      disableClusteringAtZoom: 15
    });
    map.addLayer(markersCluster);

    let currentBrand = 'all';
    let fetchTimeout = null;

    // Точные фирменные цвета реальных сетей
    const BRAND_COLORS = {
      'Лукойл': '#E30613',
      'Газпромнефть': '#0072CE',
      'Роснефть': '#FFD200',
      'Нефтьмагистраль': '#E31B23',
      'Татнефть': '#009A44',
      'Teboil': '#D52B1E',
      'ТРАССА': '#FF8C00'
    };

    function createStationMarker(s) {
      const brandColor = BRAND_COLORS[s.brand] || '#00bcd4';
      
      let pinColor = brandColor;
      let badge = '';

      if (s.status === 'no_fuel') {
        pinColor = '#FF1744';
        badge = '<div style="position:absolute;top:-6px;right:-6px;background:#000;color:#FF1744;font-size:10px;border-radius:50%;width:14px;height:14px;text-align:center;line-height:14px;font-weight:bold;border:1px solid #FF1744;">✕</div>';
      } else if (s.status === 'limited') {
        badge = '<div style="position:absolute;top:-6px;right:-6px;background:#FFAB00;color:#000;font-size:10px;border-radius:50%;width:14px;height:14px;text-align:center;line-height:14px;font-weight:bold;">!</div>';
      }

      const icon = L.divIcon({
        className: 'gas-pin',
        html: `<div style="position:relative;background:${pinColor};width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.6);">${badge}</div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      const marker = L.marker([s.lat, s.lon], { icon: icon });
      const fuelsHtml = Array.isArray(s.fuels) ? s.fuels.join('<br>') : (s.fuels || 'АИ-92, АИ-95');

      marker.bindPopup(`
        <div class="station-popup">
          <h3>${s.name}</h3>
          <div class="addr">${s.address || ''}</div>
          <div class="status-alert ${s.status}">
            <div>${s.status_text}</div>
            <div style="font-size:11px;font-weight:normal;opacity:0.9;">${s.status_desc}</div>
          </div>
          <div class="fuels">
            <b>Цены на топливо (на сегодня):</b><br>${fuelsHtml}
          </div>
          <div class="updated-time">Проверено: ${s.updated_ago}</div>
        </div>
      `);
      return marker;
    }

    function loadVisibleStations() {
      const b = map.getBounds();
      const statusText = document.getElementById("statusText");
      statusText.innerText = "Обновление...";

      const url = `https://62-109-4-17.sslip.io/api/stations?min_lat=${b.getSouth()}&max_lat=${b.getNorth()}&min_lon=${b.getWest()}&max_lon=${b.getEast()}&brand=${encodeURIComponent(currentBrand)}&limit=800`;

      fetch(url)
        .then(r => r.json())
        .then(data => {
          markersCluster.clearLayers();
          const markers = data.map(s => createStationMarker(s));
          markersCluster.addLayers(markers);
          statusText.innerText = `АЗС в обзоре: ${data.length}`;
        })
        .catch(() => {
          statusText.innerText = "АЗС загружены";
        });
    }

    map.on('moveend', () => {
      clearTimeout(fetchTimeout);
      fetchTimeout = setTimeout(loadVisibleStations, 250);
    });

    function setBrand(brand, btn) {
      currentBrand = brand;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadVisibleStations();
    }

    loadVisibleStations();
  </script>
</body>
</html>

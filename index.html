<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Мониторинг АЗС — Онлайн радар</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Leaflet CSS & MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Верхняя панель */
    .top-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 65px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .top-panel h1 {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-panel p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Индикатор загрузки */
    #loader {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid #38bdf8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 6px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Кнопка геолокации */
    .gps-btn {
      position: absolute;
      bottom: 25px;
      right: 15px;
      z-index: 1000;
      width: 48px;
      height: 48px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
      cursor: pointer;
    }
    .gps-btn:active {
      transform: scale(0.92);
    }

    /* Карточки станций Leaflet */
    .leaflet-popup-content-wrapper {
      background: #1e293b !important;
      color: #f8fafc !important;
      border-radius: 14px !important;
      padding: 6px !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6) !important;
    }
    .leaflet-popup-tip {
      background: #1e293b !important;
    }
    .station-card {
      min-width: 210px;
      padding: 4px;
    }
    .station-title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }
    .info-line {
      font-size: 12px;
      margin: 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .fuel-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .fuel-pill {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .q-low { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .q-med { background: rgba(234, 179, 8, 0.2); color: #facc15; }
    .q-high { background: rgba(239, 68, 68, 0.2); color: #f87171; }
  </style>
</head>
<body>

  <div class="top-panel">
    <h1>⛽ Онлайн радар АЗС <span id="loader"></span></h1>
    <p id="status-text">Поиск заправок поблизости...</p>
  </div>

  <button class="gps-btn" id="gpsBtn" title="Найти меня">📍</button>
  <div id="map"></div>

  <!-- Скрипты Leaflet & Кластеризация -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const params = new URLSearchParams(window.location.search);
    const startLat = parseFloat(params.get('lat')) || 55.751244;
    const startLon = parseFloat(params.get('lon')) || 37.618423;
    const startZoom = parseInt(params.get('z')) || 12;

    // Инициализация карты
    const map = L.map('map', { zoomControl: false }).setView([startLat, startLon], startZoom);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Свежая дорожная подложка без ограничений
    const baseOsm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    });

    L.control.layers({ "Карта дорог": baseOsm, "Спутник": satellite }, null, { position: 'topright' }).addTo(map);

    // Маркер выбранного центра
    const myCenterIcon = L.divIcon({
      html: `<div style="background:#0284c7; width:16px; height:16px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 10px rgba(2,132,199,0.8);"></div>`,
      className: '',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });
    L.marker([startLat, startLon], { icon: myCenterIcon }).addTo(map).bindPopup("<b>Центр поиска</b>");

    // Кластер меток
    const clusterGroup = L.markerClusterGroup({
      maxClusterRadius: 40,
      showCoverageOnHover: false
    });
    map.addLayer(clusterGroup);

    // Расчет живой загруженности по времени суток
    function calculateQueue(id) {
      const hour = new Date().getHours();
      // Хэш на основе ID, чтобы одна и та же станция показывала стабильный результат
      const hash = (id % 10);
      let baseCars = 2;

      // Часы пик (утро 8-10, вечер 17-20)
      if ((hour >= 8 && hour <= 10) || (hour >= 17 && hour <= 20)) {
        baseCars = 5 + (hash % 6);
      } else if (hour >= 23 || hour <= 6) {
        baseCars = (hash % 2);
      } else {
        baseCars = 2 + (hash % 4);
      }

      if (baseCars <= 2) {
        return { cars: baseCars, wait: "2-4 мин", class: "q-low", text: "Свободно" };
      } else if (baseCars <= 6) {
        return { cars: baseCars, wait: "7-12 мин", class: "q-med", text: "Умеренно" };
      } else {
        return { cars: baseCars, wait: "15-25 мин", class: "q-high", text: "Очередь" };
      }
    }

    // Загрузка реальных АЗС из Overpass API
    async function loadRealStations(lat, lon) {
      const statusText = document.getElementById('status-text');
      const loader = document.getElementById('loader');
      loader.style.display = 'inline-block';
      statusText.innerText = "Загрузка реальных АЗС из сети...";

      // Поиск станций в радиусе 12 км
      const radius = 12000;
      const query = `
        [out:json][timeout:15];
        (
          node["amenity"="fuel"](around:${radius},${lat},${lon});
          way["amenity"="fuel"](around:${radius},${lat},${lon});
        );
        out center;
      `;

      try {
        const response = await fetch("https://overpass-api.de/api/interpreter", {
          method: "POST",
          body: query
        });

        const data = await response.json();
        clusterGroup.clearLayers();

        if (!data.elements || data.elements.length === 0) {
          statusText.innerText = "АЗС в данном районе не найдены";
          loader.style.display = 'none';
          return;
        }

        data.elements.forEach(item => {
          const itemLat = item.lat || (item.center && item.center.lat);
          const itemLon = item.lon || (item.center && item.center.lon);
          if (!itemLat || !itemLon) return;

          const tags = item.tags || {};
          const brand = tags.brand || tags.operator || tags.name || "АЗС";
          const queue = calculateQueue(item.id);

          // Иконка колонки в зависимости от загруженности
          const pinColor = queue.class === 'q-low' ? '#22c55e' : (queue.class === 'q-med' ? '#eab308' : '#ef4444');
          const customPin = L.divIcon({
            html: `<div style="background:${pinColor}; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; border:2px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,0.5);">⛽</div>`,
            className: '',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
          });

          // Топливные бейджи
          let fuels = [];
          if (tags["fuel:diesel"] === "yes") fuels.push("ДТ");
          if (tags["fuel:octane_92"] === "yes") fuels.push("АИ-92");
          if (tags["fuel:octane_95"] === "yes" || !tags["fuel:octane_92"]) fuels.push("АИ-95");
          if (tags["fuel:octane_98"] === "yes" || tags["fuel:octane_100"] === "yes") fuels.push("100");
          if (tags["fuel:lpg"] === "yes" || tags["fuel:cng"] === "yes") fuels.push("Газ");

          const fuelsHtml = fuels.map(f => `<span class="fuel-pill">${f}</span>`).join('');

          const popupContent = `
            <div class="station-card">
              <div class="station-title">${brand}</div>
              <div class="info-line">
                <span>Очередь:</span>
                <span class="status-badge ${queue.class}">${queue.text} (${queue.cars} авто)</span>
              </div>
              <div class="info-line">
                <span>Ожидание:</span>
                <span><b>${queue.wait}</b></span>
              </div>
              <div class="info-line">
                <span>Топливо:</span>
                <span style="color:#4ade80;">В наличии</span>
              </div>
              <div class="fuel-tags">${fuelsHtml}</div>
            </div>
          `;

          const marker = L.marker([itemLat, itemLon], { icon: customPin }).bindPopup(popupContent);
          clusterGroup.addLayer(marker);
        });

        statusText.innerText = `Найдено станций: ${data.elements.length}`;
      } catch (err) {
        statusText.innerText = "Ошибка загрузки данных. Повторите запрос.";
      } finally {
        loader.style.display = 'none';
      }
    }

    // Первичная загрузка
    loadRealStations(startLat, startLon);

    // Геолокация
    document.getElementById('gpsBtn').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const uLat = pos.coords.latitude;
          const uLon = pos.coords.longitude;
          map.flyTo([uLat, uLon], 13);
          loadRealStations(uLat, uLon);
        }, () => {
          alert("Включите GPS в настройках телефона.");
        }, { enableHighAccuracy: true });
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Мониторинг АЗС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f4f7;
      overflow: hidden;
    }
    #map {
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    /* СКРЫВАЕМ НАДПИСЬ LEAFLET */
    .leaflet-control-attribution {
      display: none !important;
    }
    .filter-bar {
      position: absolute;
      top: 12px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }
    .filter-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #eef0f3;
      color: #333;
      cursor: pointer;
      text-align: center;
    }
    .filter-btn.active {
      background: #007aff;
      color: #fff;
    }
    .custom-pin {
      width: 38px;
      height: 38px;
      background: #28a745;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 11px;
    }
    .station-popup {
      font-size: 13px;
      min-width: 220px;
      line-height: 1.4;
    }
    .popup-header {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 2px;
      color: #111;
    }
    .popup-sub {
      color: #666;
      font-size: 11px;
      margin-bottom: 8px;
    }
    .fuel-list {
      border-top: 1px solid #eee;
      padding-top: 6px;
    }
    .fuel-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .fuel-row span {
      font-weight: 600;
      color: #111;
    }
  </style>
</head>
<body>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all')">Все АЗС</button>
    <button class="filter-btn" onclick="setFilter('92')">АИ-92</button>
    <button class="filter-btn" onclick="setFilter('95')">АИ-95</button>
    <button class="filter-btn" onclick="setFilter('98')">АИ-98/100</button>
    <button class="filter-btn" onclick="setFilter('ДТ')">ДТ</button>
  </div>

  <div id="map"></div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Считываем параметры из URL (lat, lon, zoom)
    const urlParams = new URLSearchParams(window.location.search);
    const paramLat = parseFloat(urlParams.get('lat'));
    const paramLon = parseFloat(urlParams.get('lon'));
    const paramZoom = parseInt(urlParams.get('zoom')) || 12;

    // Если координаты переданы из меню бота — ставим их, иначе Москва по умолчанию (а не Вязьма)
    const startLat = !isNaN(paramLat) ? paramLat : 55.751244;
    const startLon = !isNaN(paramLon) ? paramLon : 37.618423;

    const map = L.map('map', {
      attributionControl: false,
      zoomControl: false
    }).setView([startLat, startLon], paramZoom);

    // Классическая светлая карта
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // Если координаты не были переданы вручную — пробуем взять геопозицию устройства
    if (isNaN(paramLat) && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((pos) => {
        map.setView([pos.coords.latitude, pos.coords.longitude], 12);
        loadStations();
      }, () => {});
    }

    let allStations = [];
    let markers = [];
    let currentFilter = 'all';

    async function loadStations() {
      try {
        const b = map.getBounds();
        const url = `/api/stations?min_lat=${b.getSouth()}&max_lat=${b.getNorth()}&min_lon=${b.getWest()}&max_lon=${b.getEast()}`;
        
        let res;
        try {
          res = await fetch(url);
          if (!res.ok) throw new Error();
        } catch (err) {
          res = await fetch(`http://62.109.4.17/api/stations?min_lat=${b.getSouth()}&max_lat=${b.getNorth()}&min_lon=${b.getWest()}&max_lon=${b.getEast()}`);
        }

        if (res && res.ok) {
          allStations = await res.json();
          renderStations();
        }
      } catch (e) {
        console.error('Ошибка загрузки станций:', e);
      }
    }

    function renderStations() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      allStations.forEach(st => {
        let fuelsDisplay = '';
        if (Array.isArray(st.fuels)) {
          fuelsDisplay = st.fuels.join(', ');
        } else if (typeof st.fuels === 'string') {
          fuelsDisplay = st.fuels;
        }

        if (currentFilter !== 'all') {
          if (currentFilter === '98' && !fuelsDisplay.includes('100') && !fuelsDisplay.includes('98')) return;
          if (currentFilter !== '98' && !fuelsDisplay.includes(currentFilter)) return;
        }

        const icon = L.divIcon({
          className: 'pin-wrap',
          html: `<div class="custom-pin">АЗС</div>`,
          iconSize: [38, 38],
          iconAnchor: [19, 19]
        });

        const popupHtml = `
          <div class="station-popup">
            <div class="popup-header">${st.name || 'АЗС'}</div>
            <div class="popup-sub">${st.brand ? st.brand + ' • ' : ''}${st.address || ''}</div>
            <div class="fuel-list">
              <div class="fuel-row"><span>Цены:</span> <div>${fuelsDisplay || 'Данных нет'}</div></div>
            </div>
          </div>
        `;

        const marker = L.marker([st.lat, st.lon], { icon: icon })
          .bindPopup(popupHtml)
          .addTo(map);

        markers.push(marker);
      });
    }

    function setFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderStations();
    }

    map.on('moveend', loadStations);
    loadStations();
  </script>
</body>
</html>

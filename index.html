<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Мониторинг АЗС — Все станции РФ</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Leaflet CSS & MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ПОЛНОЕ УДАЛЕНИЕ БЛОКА С ФЛАГОМ И АВТОРАМИ */
    .leaflet-control-attribution {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Верхняя статусная плашка */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 65px;
      z-index: 1000;
      background: rgba(17, 24, 39, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .top-title {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-status {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 3px;
    }

    /* Спиннер загрузки данных */
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #38bdf8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Кнопка навигации GPS */
    .locate-btn {
      position: absolute;
      bottom: 25px;
      right: 15px;
      z-index: 1000;
      width: 48px;
      height: 48px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
      cursor: pointer;
    }
    .locate-btn:active {
      transform: scale(0.92);
      background: #0369a1;
    }

    /* Оформление всплывающих окон станций */
    .leaflet-popup-content-wrapper {
      background: #1f2937 !important;
      color: #f9fafb !important;
      border-radius: 12px !important;
      padding: 6px !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6) !important;
    }
    .leaflet-popup-tip {
      background: #1f2937 !important;
    }
    .station-card {
      min-width: 200px;
      padding: 4px;
    }
    .station-name {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }
    .info-row {
      font-size: 12px;
      margin: 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .b-low { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .b-med { background: rgba(234, 179, 8, 0.2); color: #facc15; }
    .b-high { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .fuel-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .fuel-tag {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-title">
      <span>⛽ Мониторинг всех АЗС</span>
      <span id="loader-box" style="display:none;"><span class="spinner"></span></span>
    </div>
    <div class="top-status" id="status-text">Загрузка данных региона...</div>
  </div>

  <button class="locate-btn" id="locateBtn" title="Моя геопозиция">📍</button>
  <div id="map"></div>

  <!-- Leaflet & Кластеризация -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const params = new URLSearchParams(window.location.search);
    const initialLat = parseFloat(params.get('lat')) || 55.751244;
    const initialLon = parseFloat(params.get('lon')) || 37.618423;
    const initialZoom = parseInt(params.get('z')) || 12;

    // Инициализация карты без копирайта с флагом
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([initialLat, initialLon], initialZoom);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Дорожная схема без ключей
    const roadLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // Спутник Esri
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19
    });

    L.control.layers({ "Карта дорог": roadLayer, "Спутник": satLayer }, null, { position: 'topright' }).addTo(map);

    // Метка центра запроса
    const centerIcon = L.divIcon({
      html: `<div style="background:#0284c7; width:16px; height:16px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 10px rgba(2,132,199,0.8);"></div>`,
      className: '',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });
    L.marker([initialLat, initialLon], { icon: centerIcon }).addTo(map).bindPopup("<b>Точка запроса</b>");

    // Кластеризация, чтобы отобразить десятки и сотни станций без тормозов
    const markersCluster = L.markerClusterGroup({
      maxClusterRadius: 45,
      showCoverageOnHover: false
    });
    map.addLayer(markersCluster);

    // Расчет очереди по часам пик
    function getQueueData(id) {
      const h = new Date().getHours();
      const seed = Math.abs(Number(id || 1)) % 10;
      let count = 2;

      if ((h >= 8 && h <= 10) || (h >= 17 && h <= 20)) {
        count = 5 + (seed % 6);
      } else if (h >= 23 || h <= 6) {
        count = seed % 2;
      } else {
        count = 2 + (seed % 4);
      }

      if (count <= 2) return { count, wait: "2-4 мин", cls: "b-low", label: "Свободно", pin: "#22c55e" };
      if (count <= 6) return { count, wait: "7-12 мин", cls: "b-med", label: "Умеренно", pin: "#eab308" };
      return { count, wait: "15-25 мин", cls: "b-high", label: "Очередь", pin: "#ef4444" };
    }

    const loadedIds = new Set();
    let fetchTimeout = null;

    // Живой запрос всех реальных АЗС в текущей видимой области
    async function fetchStationsInView() {
      const bounds = map.getBounds();
      const south = bounds.getSouth();
      const west = bounds.getWest();
      const north = bounds.getNorth();
      const east = bounds.getEast();

      // Ограничиваем запрос, если масштаб слишком мелкий (вся страна сразу)
      if (map.getZoom() < 10) {
        document.getElementById('status-text').innerText = "Приблизьте карту для отображения всех АЗС";
        return;
      }

      document.getElementById('loader-box').style.display = 'inline-block';
      document.getElementById('status-text').innerText = "Поиск реальных станций...";

      // Запрос ко всем узлам и контурам amenity=fuel в видимых границах
      const query = `[out:json][timeout:20];(node["amenity"="fuel"](${south},${west},${north},${east});way["amenity"="fuel"](${south},${west},${north},${east}););out center 250;`;
      
      const endpoints = [
        "https://overpass.kumi.systems/api/interpreter",
        "https://overpass-api.de/api/interpreter"
      ];

      let data = null;
      for (const url of endpoints) {
        try {
          const resp = await fetch(url, {
            method: "POST",
            body: query
          });
          if (resp.ok) {
            data = await resp.json();
            break;
          }
        } catch (e) {
          // пробуем следующий сервер при сбое сети
        }
      }

      document.getElementById('loader-box').style.display = 'none';

      if (!data || !data.elements) {
        document.getElementById('status-text').innerText = "Не удалось обновить АЗС. Сдвиньте карту.";
        return;
      }

      let newCount = 0;
      data.elements.forEach(item => {
        if (loadedIds.has(item.id)) return;
        loadedIds.add(item.id);

        const lat = item.lat || (item.center && item.center.lat);
        const lon = item.lon || (item.center && item.center.lon);
        if (!lat || !lon) return;

        const tags = item.tags || {};
        const brand = tags.brand || tags.operator || tags.name || "АЗС";
        const queue = getQueueData(item.id);

        const iconHtml = `<div style="background:${queue.pin}; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:bold; border:2px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,0.5);">⛽</div>`;
        const pinIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [30, 30], iconAnchor: [15, 15] });

        let fuels = [];
        if (tags["fuel:diesel"] === "yes") fuels.push("ДТ");
        if (tags["fuel:octane_92"] === "yes") fuels.push("АИ-92");
        if (tags["fuel:octane_95"] === "yes" || !tags["fuel:octane_92"]) fuels.push("АИ-95");
        if (tags["fuel:octane_98"] === "yes" || tags["fuel:octane_100"] === "yes") fuels.push("100");
        if (tags["fuel:lpg"] === "yes" || tags["fuel:cng"] === "yes") fuels.push("Газ");
        const fuelsMarkup = fuels.map(f => `<span class="fuel-tag">${f}</span>`).join('');

        const popup = `
          <div class="station-card">
            <div class="station-name">${brand}</div>
            <div class="info-row"><span>Очередь:</span><span class="badge ${queue.cls}">${queue.label} (${queue.count} авто)</span></div>
            <div class="info-row"><span>Ожидание:</span><span><b>${queue.wait}</b></span></div>
            <div class="info-row"><span>Топливо:</span><span style="color:#4ade80;">В наличии</span></div>
            <div class="fuel-tags">${fuelsMarkup}</div>
          </div>
        `;

        const m = L.marker([lat, lon], { icon: pinIcon }).bindPopup(popup);
        markersCluster.addLayer(m);
        newCount++;
      });

      document.getElementById('status-text').innerText = `Загружено станций на экране: ${loadedIds.size}`;
    }

    // Загрузка при открытии
    fetchStationsInView();

    // Загрузка новых станций при перемещении по карте
    map.on('moveend', () => {
      clearTimeout(fetchTimeout);
      fetchTimeout = setTimeout(fetchStationsInView, 600);
    });

    // Кнопка геолокации
    document.getElementById('locateBtn').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          map.flyTo([lat, lon], 13);
        }, () => {
          alert("Включите GPS в настройках устройства.");
        }, { enableHighAccuracy: true });
      }
    });
  </script>
</body>
</html>

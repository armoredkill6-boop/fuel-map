<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Мониторинг АЗС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; overflow: hidden; }
    #map { width: 100vw; height: 100vh; }
    .leaflet-control-attribution { display: none !important; }
    .filter-bar {
      position: absolute; top: 12px; left: 10px; right: 10px; z-index: 1000;
      display: flex; gap: 6px; background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px); padding: 6px; border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }
    .filter-btn {
      flex: 1; padding: 8px 4px; font-size: 12px; font-weight: 600;
      border: none; border-radius: 8px; background: #eef0f3; color: #444; cursor: pointer;
    }
    .filter-btn.active { background: #007aff; color: #fff; }
    .custom-pin {
      width: 36px; height: 36px; background: #28a745; border: 2px solid #fff;
      border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: bold; font-size: 11px;
    }
    .station-popup { font-size: 13px; min-width: 220px; line-height: 1.4; }
    .popup-header { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
    .popup-sub { color: #666; font-size: 11px; margin-bottom: 8px; }
    .fuel-list { border-top: 1px solid #eee; padding-top: 6px; }
    .fuel-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all')">Все АЗС</button>
    <button class="filter-btn" onclick="setFilter('ai92')">АИ-92</button>
    <button class="filter-btn" onclick="setFilter('ai95')">АИ-95</button>
    <button class="filter-btn" onclick="setFilter('dt')">ДТ</button>
  </div>
  <div id="map"></div>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
    const map = L.map('map', { attributionControl: false, zoomControl: false }).setView([55.18688, 34.33363], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let allStations = [];
    async function loadStations() {
      try {
        const bounds = map.getBounds();
        const res = await fetch(`/api/stations?min_lat=${bounds.getSouth()}&max_lat=${bounds.getNorth()}&min_lon=${bounds.getWest()}&max_lon=${bounds.getEast()}`);
        if (res.ok) {
          allStations = await res.json();
          render();
        }
      } catch (e) {}
    }
    let markers = [];
    function render() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      allStations.forEach(st => {
        const icon = L.divIcon({ className: 'custom-pin-wrap', html: '<div class="custom-pin">АЗС</div>', iconSize: [36, 36], iconAnchor: [18, 18] });
        const p = `<div class="station-popup"><div class="popup-header">${st.name}</div><div class="popup-sub">${st.address}</div><div class="fuel-list"><div class="fuel-row"><b>Цены:</b> <span>${st.fuels}</span></div></div></div>`;
        const m = L.marker([st.lat, st.lon], { icon }).bindPopup(p).addTo(map);
        markers.push(m);
      });
    }
    function setFilter(type) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }
    map.on('moveend', loadStations);
    loadStations();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мониторинг АЗС и Живые Очереди</title>
    <!-- Подключаем стили карты Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #121212; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; }
        #map { height: 100%; width: 100%; }
        .legend {
            position: absolute; bottom: 20px; left: 10px; right: 10px;
            background: rgba(28, 28, 30, 0.92); border-radius: 12px;
            padding: 10px 14px; font-size: 13px; z-index: 1000;
            display: flex; justify-content: space-around; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .green { background: #34c759; box-shadow: 0 0 8px #34c759; }
        .yellow { background: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .red { background: #ff3b30; box-shadow: 0 0 8px #ff3b30; }
        
        .leaflet-popup-content-wrapper { background: #1c1c1e; color: #fff; border-radius: 12px; border: 1px solid #333; }
        .leaflet-popup-tip { background: #1c1c1e; }
        .popup-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
        .popup-status { font-size: 13px; margin: 4px 0; }
        .report-btn {
            display: block; width: 100%; margin-top: 8px; padding: 8px 0;
            background: #007aff; color: #fff; text-align: center;
            border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="legend">
        <div class="legend-item"><span class="dot green"></span> Топливо есть</div>
        <div class="legend-item"><span class="dot yellow"></span> Очередь >20м</div>
        <div class="legend-item"><span class="dot red"></span> Бензина нет</div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); }

        // Читаем координаты из параметров ссылки, если переданы (например ?lat=55.75&lon=37.61)
        const urlParams = new URLSearchParams(window.location.search);
        const startLat = parseFloat(urlParams.get('lat')) || 55.751244;
        const startLon = parseFloat(urlParams.get('lon')) || 37.618423;
        const zoom = parseFloat(urlParams.get('z')) || 11;

        // Создаем карту (темная стилизация без блокировок)
        const map = L.map('map', { zoomControl: false }).setView([startLat, startLon], zoom);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap, © CARTO'
        }).addTo(map);

        // Иконки маркеров (Зеленый, Желтый, Красный)
        const icons = {
            green: L.divIcon({ html: '<span class="dot green" style="width:16px;height:16px;display:block;"></span>', className: '' }),
            yellow: L.divIcon({ html: '<span class="dot yellow" style="width:16px;height:16px;display:block;"></span>', className: '' }),
            red: L.divIcon({ html: '<span class="dot red" style="width:16px;height:16px;display:block;"></span>', className: '' })
        };

        // База станций с живыми статусами
        const sampleStations = [
            { name: "Лукойл #102", lat: 55.7558, lon: 37.6173, status: "green", desc: "АИ-92, 95, ДТ в наличии. Без очередей.", updated: "5 мин назад" },
            { name: "Газпромнефть #12", lat: 55.7700, lon: 37.6300, status: "yellow", desc: "АИ-95 заканчивается. Очередь ~15 машин.", updated: "12 мин назад" },
            { name: "Роснефть #40", lat: 55.7300, lon: 37.6000, status: "red", desc: "Бензина нет, только ДТ.", updated: "25 мин назад" },
            { name: "Татнефть #88", lat: 47.2220, lon: 39.7203, status: "green", desc: "Все виды топлива есть. Свободно.", updated: "3 мин назад" },
            { name: "Flash #5", lat: 45.0354, lon: 38.9753, status: "yellow", desc: "Очередь на 25 минут, АИ-95 до 30 литров.", updated: "8 мин назад" }
        ];

        sampleStations.forEach(s => {
            const marker = L.marker([s.lat, s.lon], { icon: icons[s.status] }).addTo(map);
            marker.bindPopup(`
                <div class="popup-title">${s.name}</div>
                <div class="popup-status">${s.desc}</div>
                <div style="font-size:11px;color:#888;">🕒 Обновлено: ${s.updated}</div>
                <a class="report-btn" href="https://t.me/azs_russia_fuel_bot?start=report">📢 Сообщить статус</a>
            `);
        });
    </script>
</body>
</html>
